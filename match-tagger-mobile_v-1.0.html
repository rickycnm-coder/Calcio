<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10120d">
<title>Riccardo Moro's Match Analysis — Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@500;600;700&family=IBM+Plex+Mono:wght@600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10120d; --bg-panel:#171a13; --bg-elevated:#1f2318;
    --line: rgba(237,239,232,0.10); --line-strong: rgba(237,239,232,0.22);
    --text:#EDEFE8; --text-dim:#9BA294;
    --green:#6FCF57; --blue:#4FA3D1; --purple:#9B8AC4; --gold:#D9C15C;
    --casa-bg:#FFFFFF; --casa-text:#C8102E; --casa-border:#C8102E;
    --ospiti-bg:#232C3B; --ospiti-text:#F2F4F7; --ospiti-border:#3E4C63;
    --red-dim:#5A2A2A;
    --font-display:'Oswald', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ overscroll-behavior-y:contain; background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; width:100%; margin-bottom:2px; }
  .clock{ font-family:var(--font-mono); font-size:26px; font-weight:600; min-width:90px; }
  .clock.running{ color:var(--green); }
  .half{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); border:1px solid var(--line-strong); border-radius:6px; padding:6px 9px; }
  .topbtn{
    font-family:var(--font-body); font-weight:600; font-size:13px; border:none; border-radius:8px;
    padding:10px 14px; cursor:pointer; touch-action:manipulation;
  }
  .topbtn.start{ background:#2E4A24; color:#DFF7D6; margin-left:auto; }
  .topbtn.half{ background:var(--bg-elevated); color:var(--text); }

  .matchinfo{
    background:var(--bg); border-bottom:1px solid var(--line); padding:8px 14px 10px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .matchinfo input{
    font-family:var(--font-body); font-weight:600; font-size:13px; background:var(--bg-elevated);
    color:var(--text); border:1px solid var(--line-strong); border-radius:7px; padding:7px 9px;
    flex:1 1 110px; min-width:0;
  }
  .matchinfo input[type=date]{ flex:0 0 128px; color:var(--text-dim); }
  .matchinfo .vs{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); flex:0 0 auto; }
  .matchinfo .fixedteam{
    font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--casa-text);
    background:var(--casa-bg); border:1px solid var(--casa-border); border-radius:7px; padding:7px 10px;
    flex:0 0 auto;
  }

  .legend{ display:flex; gap:14px; padding:2px 14px 12px; font-size:11px; color:var(--text-dim); }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend i{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .legend .i-casa{ background:var(--casa-bg); border:1.5px solid var(--casa-border); }
  .legend .i-ospiti{ background:var(--ospiti-bg); border:1.5px solid var(--ospiti-border); }

  .section{ padding:6px 12px 4px; }
  .section-title{
    font-family:var(--font-display); font-size:12.5px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; margin:14px 2px 8px; display:flex; align-items:center; gap:8px; color:var(--text-dim);
  }
  .section-title .dot{ width:8px; height:8px; border-radius:50%; }

  .tile2{
    border-radius:12px; overflow:hidden; margin-bottom:8px; border-top:4px solid transparent;
    display:flex; flex-direction:column;
  }
  .tile2.grp-tiri{ border-top-color:var(--green); }
  .tile2.grp-inattive{ border-top-color:var(--blue); }
  .tile2.grp-duelli{ border-top-color:var(--purple); }
  .tile2.grp-disciplina{ border-top-color:var(--gold); }

  .tile2-label{
    background:var(--bg-panel); color:var(--text); font-size:13px; font-weight:700;
    text-align:center; padding:7px 8px; text-transform:uppercase; letter-spacing:.02em;
  }
  .tile2-halves{ display:flex; }
  .half{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 8px; cursor:pointer; touch-action:manipulation; min-height:56px;
  }
  .half:active{ filter:brightness(0.92); }
  .half.casa{ background:var(--casa-bg); color:var(--casa-text); border-right:1.5px solid var(--casa-border); }
  .half.ospiti{ background:var(--ospiti-bg); color:var(--ospiti-text); }
  .halflbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; opacity:0.7; text-transform:uppercase; }
  .halfcnt{ font-family:var(--font-mono); font-size:22px; font-weight:700; min-width:22px; text-align:center; }

  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg-panel);
    border-top:1px solid var(--line); padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:7px;
  }
  .lastevent{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); min-height:18px;
  }
  .lastevent b{ color:var(--text); font-weight:600; }
  .lastevent button{
    font-family:var(--font-body); font-weight:700; font-size:11.5px; background:var(--red-dim); color:#FBDADA;
    border:none; border-radius:7px; padding:5px 10px; touch-action:manipulation; margin-left:auto; flex-shrink:0;
  }
  .bottomrow{ display:flex; gap:8px; align-items:center; }
  .undobtn{
    flex:1; font-family:var(--font-body); font-weight:700; font-size:15px; background:var(--red-dim);
    color:#FBDADA; border:none; border-radius:10px; padding:14px; touch-action:manipulation;
  }
  .menubtn{
    font-family:var(--font-body); font-weight:600; font-size:13px; background:var(--bg-elevated);
    color:var(--text-dim); border:none; border-radius:10px; padding:14px 16px; touch-action:manipulation;
  }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:none; }
  .sheet-backdrop.show{ display:block; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--bg-panel);
    border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .2s ease; max-height:80vh; overflow-y:auto;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet h2{ font-family:var(--font-display); font-size:17px; margin:0 0 12px; }
  .sheet button.close{ width:100%; margin-top:14px; padding:12px; border-radius:10px; background:var(--bg-elevated); color:var(--text); border:none; font-weight:600; font-family:var(--font-body); }
  .sumtable{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .sumtable th{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--text-dim); text-align:center; padding:6px 4px; border-bottom:1px solid var(--line-strong); }
  .sumtable th:first-child{ text-align:left; }
  .sumtable td{ padding:7px 4px; text-align:center; border-bottom:1px solid var(--line); font-family:var(--font-mono); }
  .sumtable td:first-child{ text-align:left; font-family:var(--font-body); font-weight:600; }
  .sheet .danger{ color:#E27070; background:var(--red-dim); width:100%; padding:12px; border-radius:10px; border:none; margin-top:10px; font-weight:700; font-family:var(--font-body); }
  .sheet .exportbtn{ width:100%; padding:13px; border-radius:10px; background:#2E4A24; color:#DFF7D6; border:none; font-weight:700; font-family:var(--font-body); margin-bottom:8px; }

  @media print{
    .topbar, .matchinfo, .legend, .section, .bottombar, .sheet-backdrop, .sheet{ display:none !important; }
    body{ background:#fff; padding-bottom:0; }
    #printHeader{ display:block !important; }
  }
  .print-doc{ font-family:'Inter', sans-serif; color:#111; position:relative; padding-top:4px; }
  .print-logo{ position:absolute; top:0; right:0; width:100px; height:100px; object-fit:contain; }
  .print-title{ width:100%; border-collapse:collapse; margin:0 130px 18px 0; }
  .print-title td{ border:1.5px solid #111; padding:10px 14px; font-size:15px; vertical-align:middle; }
  .print-title .lbl{ font-weight:700; text-transform:uppercase; }
  .print-title .val{ font-family:'Caveat', cursive; font-weight:700; font-size:20px; margin-left:6px; }
  .print-stats{ width:100%; max-width:560px; border-collapse:collapse; }
  .print-stats th, .print-stats td{ border:1.5px solid #111; padding:7px 10px; font-size:12.5px; }
  .print-stats th{ text-transform:uppercase; font-weight:700; text-align:center; }
  .print-stats td:first-child{ text-transform:uppercase; }
  .print-stats td:not(:first-child){ text-align:center; font-weight:600; width:70px; }
</style>
</head>
<body>

<div id="printHeader" style="display:none;"></div>

<div class="topbar">
  <span class="eyebrow">Riccardo Moro's Match Analysis — Rilevamento sul campo</span>
  <div class="clock" id="clock">00:00</div>
  <div class="half" id="halfLabel">1° tempo</div>
  <button class="topbtn half" onclick="switchHalf()">Cambia tempo</button>
  <button class="topbtn start" id="toggleBtn" onclick="toggleClock()">Avvia</button>
</div>

<div class="matchinfo">
  <span class="fixedteam">Monselice</span>
  <span class="vs">vs</span>
  <input type="text" id="oppName" placeholder="Avversario" oninput="updateTeamLabels()">
  <input type="date" id="matchDate">
</div>

<div class="legend">
  <span><i class="i-casa"></i> <span id="legendCasa">Nostra squadra — tocca a sinistra</span></span>
  <span><i class="i-ospiti"></i> <span id="legendOspiti">Avversario — tocca a destra</span></span>
</div>

<div class="section">
  <p class="section-title"><span class="dot" style="background:var(--green)"></span>Tiri</p>
  <div id="grpTiri"></div>

  <p class="section-title"><span class="dot" style="background:var(--blue)"></span>Palle inattive</p>
  <div id="grpInattive"></div>

  <p class="section-title"><span class="dot" style="background:var(--purple)"></span>Duelli e recuperi</p>
  <div id="grpDuelli"></div>

  <p class="section-title"><span class="dot" style="background:var(--gold)"></span>Disciplina</p>
  <div id="grpDisciplina"></div>
</div>

<div class="bottombar">
  <div class="lastevent" id="lastevent">
    <span id="lasteventText">Nessun evento registrato ancora.</span>
    <button id="lasteventUndo" onclick="undoFromLast()" style="display:none;">ANNULLA</button>
  </div>
  <div class="bottomrow">
    <button class="undobtn" onclick="undo()">↩ ANNULLA ULTIMO</button>
    <button class="menubtn" onclick="openSheet()">Riepilogo</button>
  </div>
</div>

<div class="sheet-backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <h2>Riepilogo partita</h2>
  <table class="sumtable" id="sumtable"></table>
  <button class="exportbtn" onclick="exportCSV()">Esporta CSV</button>
  <button class="exportbtn" style="background:#254257; color:#DCEEFA;" onclick="exportPDF()">Esporta PDF</button>
  <button class="danger" onclick="clearAll()">Azzera tutti i dati</button>
  <button class="close" onclick="loadDemo()" style="margin-top:8px; background:none; color:var(--text-dim); font-weight:500; font-size:12px;">Carica dati di esempio (solo per anteprima)</button>
  <button class="close" onclick="closeSheet()">Chiudi</button>
</div>

<script>
const categories = [
  {id:'tiro_d_in',  label:'Tiro dentro area — in porta',  group:'tiri'},
  {id:'tiro_d_out', label:'Tiro dentro area — fuori',      group:'tiri'},
  {id:'tiro_f_in',  label:'Tiro fuori area — in porta',    group:'tiri'},
  {id:'tiro_f_out', label:'Tiro fuori area — fuori',       group:'tiri'},

  {id:'corner',     label:'Corner',                group:'inattive'},
  {id:'punizione',  label:'Punizione 3/4 in area',  group:'inattive'},
  {id:'fuorigioco', label:'Fuorigioco',             group:'inattive'},
  {id:'rigore',     label:'Rigore',                 group:'inattive'},

  {id:'palla_riconquistata', label:'Palla riconquistata',    group:'duelli'},
  {id:'palla_persa',         label:'Palla persa',            group:'duelli'},
  {id:'duello_vinto',        label:'Duello vinto',           group:'duelli'},
  {id:'duello_perso',        label:'Duello perso',           group:'duelli'},

  {id:'ammonizione', label:'Ammonizione',  group:'disciplina'},
  {id:'fallo',        label:'Fallo',        group:'disciplina'},
  {id:'gol',           label:'Gol',          group:'disciplina'},
  {id:'espulsione',    label:'Espulsione',   group:'disciplina'},
  {id:'sostituzione',  label:'Sostituzione', group:'disciplina'},
];
const GROUP_CLASS = {tiri:'grp-tiri', inattive:'grp-inattive', duelli:'grp-duelli', disciplina:'grp-disciplina'};

let events = [];
let eventIdSeq = 1;
let half = 1, running = false, startTs = null;
let elapsedByHalf = {1:0, 2:0};
let lastEventId = null;

function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
// Uses Date.now() (wall-clock) instead of performance.now(), so the timer
// does not drift or lose time when the screen locks / the tab is backgrounded.
function currentSeconds(){
  let base = elapsedByHalf[half];
  if(running) base += (Date.now()-startTs)/1000;
  return base;
}
function tick(){ document.getElementById('clock').textContent = fmt(currentSeconds()); requestAnimationFrame(tick); }
requestAnimationFrame(tick);

function toggleClock(){
  if(running){ elapsedByHalf[half] = currentSeconds(); running = false; }
  else { startTs = Date.now(); running = true; }
  document.getElementById('clock').classList.toggle('running', running);
  document.getElementById('toggleBtn').textContent = running ? 'Pausa' : 'Avvia';
}
function switchHalf(){
  if(running) toggleClock();
  half = half === 1 ? 2 : 1;
  document.getElementById('halfLabel').textContent = half === 1 ? '1° tempo' : '2° tempo';
}

function renderTiles(){
  const groups = { tiri:document.getElementById('grpTiri'), inattive:document.getElementById('grpInattive'),
                    duelli:document.getElementById('grpDuelli'), disciplina:document.getElementById('grpDisciplina') };
  Object.values(groups).forEach(g => g.innerHTML = '');
  categories.forEach(cat => {
    const t = document.createElement('div');
    t.className = 'tile2 ' + GROUP_CLASS[cat.group];
    t.innerHTML = `
      <div class="tile2-label">${cat.label}</div>
      <div class="tile2-halves">
        <div class="half casa" data-cat="${cat.id}" data-team="casa">
          <span class="halflbl lbl-casa">Nostra squadra</span><span class="halfcnt" id="cnt-${cat.id}-casa">0</span>
        </div>
        <div class="half ospiti" data-cat="${cat.id}" data-team="ospiti">
          <span class="halflbl lbl-ospiti">Avversario</span><span class="halfcnt" id="cnt-${cat.id}-ospiti">0</span>
        </div>
      </div>`;
    groups[cat.group].appendChild(t);
  });
  document.querySelectorAll('.half').forEach(h => {
    h.onclick = () => logEvent(h.dataset.cat, h.dataset.team);
  });
  updateTeamLabels();
}
function countOf(catId, team){ return events.filter(e => e.catId===catId && e.team===team).length; }
function renderCounts(){
  categories.forEach(c => {
    const ca = document.getElementById(`cnt-${c.id}-casa`);
    const os = document.getElementById(`cnt-${c.id}-ospiti`);
    if(ca) ca.textContent = countOf(c.id, 'casa');
    if(os) os.textContent = countOf(c.id, 'ospiti');
  });
}
function updateTeamLabels(){
  const info = matchInfo();
  document.querySelectorAll('.lbl-casa').forEach(el => el.textContent = info.team);
  document.querySelectorAll('.lbl-ospiti').forEach(el => el.textContent = info.opp);
  const lc = document.getElementById('legendCasa'), lo = document.getElementById('legendOspiti');
  if(lc) lc.textContent = info.team + ' — tocca a sinistra';
  if(lo) lo.textContent = info.opp + ' — tocca a destra';
}

function logEvent(catId, team){
  const cat = categories.find(c => c.id === catId);
  const ev = { id:eventIdSeq++, catId:cat.id, label:cat.label, group:cat.group, team, half, time:currentSeconds() };
  events.push(ev);
  renderCounts();
  updateLastEvent(ev);
  if(navigator.vibrate) navigator.vibrate(15);
}
function updateLastEvent(ev){
  lastEventId = ev.id;
  const info = matchInfo();
  const teamLabel = ev.team === 'casa' ? info.team : info.opp;
  document.getElementById('lasteventText').innerHTML = `<b>${ev.label}</b> — ${teamLabel}, ${ev.half}T ${fmt(ev.time)}`;
  document.getElementById('lasteventUndo').style.display = 'inline-block';
}
function clearLastEvent(){
  lastEventId = null;
  document.getElementById('lasteventText').textContent = 'Nessun evento registrato ancora.';
  document.getElementById('lasteventUndo').style.display = 'none';
}
function undoFromLast(){
  if(lastEventId === null) return;
  events = events.filter(e => e.id !== lastEventId);
  renderCounts();
  clearLastEvent();
}
function undo(){
  const removed = events.pop();
  renderCounts();
  if(removed && removed.id === lastEventId) clearLastEvent();
}
function clearAll(){
  if(!confirm('Azzerare tutti i dati registrati?')) return;
  events = [];
  renderCounts();
  clearLastEvent();
  closeSheet();
}

function openSheet(){
  let html = `<tr><th>Avvenimento</th><th>Casa</th><th>Ospiti</th></tr>`;
  categories.forEach(c => {
    html += `<tr><td>${c.label}</td><td>${countOf(c.id,'casa')}</td><td>${countOf(c.id,'ospiti')}</td></tr>`;
  });
  html += `<tr><td><b>Eventi totali</b></td><td><b>${events.filter(e=>e.team==='casa').length}</b></td><td><b>${events.filter(e=>e.team==='ospiti').length}</b></td></tr>`;
  document.getElementById('sumtable').innerHTML = html;
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

function matchInfo(){
  const team = 'Monselice';
  const opp = document.getElementById('oppName').value.trim() || 'Avversario';
  const date = document.getElementById('matchDate').value || '';
  return {team, opp, date};
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'na'; }

function exportCSV(){
  const info = matchInfo();
  const rows = [['Squadra', info.team], ['Avversario', info.opp], ['Data', info.date], []];
  rows.push(['Tempo di gioco','Semitempo','Squadra','Categoria','Gruppo']);
  events.forEach(e => rows.push([fmt(e.time), e.half+'T', e.team==='casa'?info.team:info.opp, e.label, e.group]));
  rows.push([]);
  rows.push(['Avvenimento', 'Casa ('+info.team+')', 'Ospiti ('+info.opp+')']);
  categories.forEach(c => rows.push([c.label, countOf(c.id,'casa'), countOf(c.id,'ospiti')]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `match-events-${slug(info.team)}-vs-${slug(info.opp)}-${info.date||'senza-data'}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function exportPDF(){
  const info = matchInfo();
  const dateLabel = info.date ? new Date(info.date+'T12:00:00').toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'}) : 'data non indicata';
  const rows = categories.map(c => `<tr><td>${c.label.toUpperCase()}</td><td>${countOf(c.id,'casa')}</td><td>${countOf(c.id,'ospiti')}</td></tr>`).join('');
  document.getElementById('printHeader').innerHTML = `
    <div class="print-doc">
      <table class="print-title"><tr>
        <td><span class="lbl">Tabellino</span><span class="val">${info.team} – ${info.opp}</span></td>
        <td><span class="lbl">Data:</span><span class="val">${dateLabel}</span></td>
      </tr></table>
      <table class="print-stats">
        <tr><th>Avvenimenti</th><th>${info.team}</th><th>${info.opp}</th></tr>
        ${rows}
      </table>
    </div>`;
  window.print();
}

function loadDemo(){
  if(events.length && !confirm('Sostituire i dati attuali con dati di esempio?')) return;
  events = [];
  eventIdSeq = 1;
  const demo = {
    tiro_d_in:[3,1], tiro_d_out:[2,2], tiro_f_in:[1,0], tiro_f_out:[4,3],
    corner:[5,2], punizione:[2,1], fuorigioco:[3,2], rigore:[1,0],
    palla_riconquistata:[14,9], palla_persa:[11,12], duello_vinto:[9,6], duello_perso:[7,8],
    ammonizione:[2,3], fallo:[8,10], gol:[2,1], espulsione:[0,0], sostituzione:[3,3]
  };
  Object.entries(demo).forEach(([id, [nc, no]]) => {
    const cat = categories.find(c => c.id === id);
    for(let i=0;i<nc;i++) events.push({ id:eventIdSeq++, catId:cat.id, label:cat.label, group:cat.group, team:'casa', half: Math.random()<0.5?1:2, time: Math.floor(Math.random()*2700) });
    for(let i=0;i<no;i++) events.push({ id:eventIdSeq++, catId:cat.id, label:cat.label, group:cat.group, team:'ospiti', half: Math.random()<0.5?1:2, time: Math.floor(Math.random()*2700) });
  });
  renderCounts();
  openSheet();
}

renderTiles();
renderCounts();
</script>
